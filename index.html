<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glitch Loom</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%231d2b53'/%3E%3Cpath d='M1 2h6v1H1zM1 5h6v1H1z' fill='%23ffd166'/%3E%3Cpath d='M2 1h1v6H2zM5 1h1v6H5z' fill='%23ef476f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<header class="brand"><span class="mark">Loom</span><span class="sub">Internal Glitch tool</span><button type="button" id="coursebtn" class="coursebtn" data-a="picker" aria-haspopup="dialog" hidden><span>Course</span><i aria-hidden="true">▾</i></button></header>
<p id="savewarn" role="alert" hidden><strong>Not saved to disk.</strong> Loom’s local server is not taking saves. Your latest changes are held in this browser. Keep this page open and start the server again.</p>
<p id="bootnote" role="status" hidden><span></span> <button type="button" class="pill small" data-a="noteOk">Understood</button></p>
<main id="ui"></main>
<dialog id="sheet" aria-labelledby="sh"></dialog>
<dialog id="picker" aria-labelledby="ph"></dialog>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="padding:24px;color:#fff">Glitch Loom needs JavaScript to run.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
